*start
@chapter 序章　8月24日（日）
@bg train dusk
@music night
冷氣的聲音比引擎還大。
從幹線換到支線之後，車廂裡的人一站一站少下去，最後只剩我、一個抱著保麗龍箱的阿伯，和一袋不知道是誰忘在座位上的芭樂。
窗外是海。一直都是海。
我把手機舉起來想拍，訊號從四格掉到一格，畫面卡在一片橘色上，不動了。
阿嬤上禮拜打電話來，只講了三句話。
阿嬤：車要停了啦，你要不要回來坐一次？
阿嬤：我不是叫你一定要回來喔。
阿嬤：啊你要回來的話，記得買那個台北的鳳梨酥。
我說好。鳳梨酥在我的背包裡，被壓扁了一個角。
@sfx bell
平交道的鈴聲從窗外滑過去，叮、噹、叮、噹，然後被甩在後面。
上一次坐這條線，我十歲。那時候我覺得九公里很長。
我記得的不多。車廂的椅子是綠色的，坐久了大腿會黏在上面。窗戶可以往上推開一條縫，風灌進來的時候，阿嬤會叫我把頭縮回去。
還有一個人，坐在我對面，一直在跟我講話。
我不記得那個人是誰。只記得她講話很快。
@wait 600
廣播：下一站，浪尾。浪尾站到了，請小心月台間隙。
是個女生的聲音。有點舊，像是一捲錄音帶被轉過很多次。
阿伯抱著保麗龍箱站起來，看了我一眼。
阿伯：少年仔，你也浪尾下喔？
晏：嗯。
阿伯：浪尾下車的少年仔，很少了喔。
他說完自己笑了，好像講了一個只有他聽得懂的笑話。

@bg station dusk
@music stop
車門打開，海風灌進來，帶著一點鹹味和柴油味。
月台比我記得的短。木頭站房還在，屋簷下的燈已經亮了，寫著「浪尾」的站牌，白漆剝了一半。
@sfx train
列車關門，慢慢開走。我拖著行李往出口走——
@show shao normal center
韶[？？？]：噓。
晏(surprised)：……？
月台盡頭蹲著一個女生，手上拿著一台方方正正的機器，對著越來越遠的車尾。
她另一隻手對我比了「安靜」，眼睛沒有離開軌道。

#end

*pro_wait
我把行李箱的輪子停住，站在原地。
風聲。遠遠的車輪聲。一隻不知道躲在哪裡的蟬，叫到一半停了。
大概過了一分鐘，那個女生按下機器上的一個鍵，喀一聲。
@sfx tape
韶[？？？](smile)：謝謝。
韶[？？？]：一分十二秒。沒有雜音。這個禮拜最乾淨的一次。
晏：……不客氣？
她站起來，拍了拍裙子上的灰。
@jump pro_after

韶[？？？]：沒關係。你不知道。

@jump pro_after

@show shao normal center
她手上是一台卡式錄音機。銀色的，邊角的漆磨掉了，貼著一張手寫標籤，字太小看不清楚。
這年頭還有人用這種東西。
韶[？？？]：你是福興商店的孫子。
晏(surprised)：妳怎麼知道？
韶[？？？]：這個時間從這班車下來、拖著行李、不是觀光客的人，只有你。阿嬤這個禮拜跟每個人都講過了。
韶[？？？]：她說你在台北念書，很高，不太講話。
晏：……
韶[？？？]：第三點是對的。
她把錄音機掛回脖子上，旁邊還掛著一副耳機。
韶：我叫程韶。站長是我爺爺。
韶：林晏先生，出口在那邊。驗票口沒有人，票丟進箱子裡就好。
她說完就往站長室走了，沒有回頭。
@hide shao
「林晏先生」。我活了十八年，第一次被人這樣叫。

@bg street dusk
@music daily
出了車站，正對面就是阿嬤的店。
福興商店。招牌是手畫的，紅底白字，「福」字的最後一筆拉得特別長，像寫的人在那裡停了一下。
小時候覺得那塊招牌很大。現在看，它只是褪色了。

@bg shop day
@sfx door
阿嬤：喔——來了喔。
阿嬤從櫃台後面站起來，手上還拿著蒼蠅拍。
阿嬤：怎麼長這麼高？你爸是給你吃什麼？
晏(smile)：阿嬤。
阿嬤：鳳梨酥咧？
晏：在這裡。壓到了一點。
阿嬤：壓到也是鳳梨酥啦。
她接過去，看都沒看就放到櫃台底下，然後拍了一下我的手臂。
阿嬤：瘦。呷飽未？
晏：在車上吃了。
阿嬤：車上那是什麼東西，不算。
店裡跟我記得的一樣，又不太一樣。玻璃罐裡的酸梅糖、掛在牆上的乖乖、冰箱上的養樂多貼紙。
只是天花板的吊扇換了一台，月曆上的女明星我不認識了。
@sfx door
小滿[？？？]：阿嬤！冰塊放門口喔，錢我跟妳月底一起算——
@show xiaoman normal center
門口站著一個女生，曬得黑黑的，馬尾綁得很高，圍裙濕了一大片。
她兩手拎著兩大袋冰塊，看到我，停住了。
她盯著我看了三秒。從頭看到腳，再從腳看回來。
小滿[？？？]：台北人？
晏：……嗯，我從台北來的。
小滿[？？？](angry)：齁——真的是你喔。
她把冰塊往地上一放，雙手叉腰。
小滿[？？？]：阿嬤講了一個禮拜，我還以為她在唬爛。
阿嬤：小滿，妳講話卡有禮貌一點。
小滿(smile)：有啦有啦。歡迎回來喔，台北人。
她特別強調了最後三個字。
小滿：冰塊放這邊，我先走了，我爸在等。
@hide xiaoman
@sfx door
門口的風鈴響了一下。她已經騎上腳踏車，後座綁著一個藍色的保冰箱。
晏：……那是誰？
阿嬤：許家的小滿啊。你忘了喔？
阿嬤：你小時候跟她最好，每天黏在一起，回台北那天還哭。
晏(troubled)：我哭？
阿嬤：哭到鼻涕流到嘴巴。
我完全不記得。
感覺有點怪，好像有人拿著一本我的日記，裡面寫的東西我一頁都沒看過。

@bg room night
@music stop
阿嬤給我住二樓最裡面的房間。
鐵窗外面是山，山的輪廓比天空黑一點點。電風扇轉起來會喀喀響，每轉一圈響一次。
@sfx phone
手機震了一下。訊號一格，訊息卡了很久才跑出來。
是爸。「到了嗎」。沒有問號。
我回「到了」。也沒有句號。
我躺在床上，聽著電風扇喀、喀、喀，想起那個錄音機女生的話。
不是觀光客的人，只有你。
這條線還有七天就要停了。
我好像是來送別的，可是我連它原本長什麼樣子都記不太清楚。
@jump day1

*day1
@chapter 第一天　8月25日（一）
@bg shop day
@music daily
@sfx door
早上七點，阿嬤已經把店門拉開了。
阿嬤：起來了喔。來，顧店。
晏：我要做什麼？
阿嬤：客人拿東西，你收錢。客人沒拿東西，你坐著。
阿嬤：很簡單，憨孫都會。
第一個客人是小學生，拿了一包乖乖和一罐麥香，付了三十五塊。我找他五塊，他說「謝謝哥哥」，在門口把乖乖拆開，把裡面的玩具丟掉，吃了一口就跑了。
第二個客人是隔壁的阿伯，買一包菸，跟阿嬤聊了二十分鐘他兒子在高雄的事。
第三個客人十點半才出現。
十點半到十一點之間，我算了一下，天花板的吊扇大概轉了兩千圈。
阿嬤：好，你去幫我跑一下。
阿嬤從櫃台底下拿出一張紙和一個塑膠袋。
阿嬤：這張拿去許家冰店，下禮拜的冰塊要多訂，最後一天人會很多。
阿嬤：這包酸梅糖，拿去車站旁邊那間倉庫，二樓，給阿佩。
晏：阿佩？
阿嬤：蘇家那個女兒啦，從台北回來的。她很愛吃這個，一次買一大包，自己又懶得來拿。
阿嬤：去，順便給人家認識一下，不要整天關在房間裡。
晏：我才來一天。
阿嬤：一天就夠關了。

@bg street day
許家冰店在斜對角，走路三十秒。
門口的布棚是藍白條紋的，菜單用麥克筆寫在牆上：紅豆牛奶冰四十、芒果冰八十、綜合冰六十五。
「芒果冰」那一行被劃掉了，旁邊寫著「八月沒有了，明年請早」。
@show xiaoman normal center
小滿：歡迎光臨——喔，是你。
小滿拿著一支鐵湯匙站在刮冰機旁邊，看到我，湯匙停在半空。
晏：阿嬤叫我拿這個來。下禮拜的冰塊。
小滿：喔。
她接過紙條，看了一眼，往圍裙口袋裡一塞。
小滿：最後一天要四十包？你阿嬤是要開冰庫喔。
晏：她說那天人會很多。
小滿(sad)：……是啦。最後一天，大家都會來拍照。
小滿：拍完就走了。
她把湯匙放下，突然抬頭看我。
小滿：欸，台北人。我問你一件事。
小滿：你還記得我嗎？

@bg station dusk
@music sad
最後一天，18:40。
月台上擠滿了人。
佩畫的布條掛在屋簷下，風吹過去的時候，整列畫出來的火車會輕輕晃一下。
小滿家的冰攤還在排隊。她的馬尾已經散了一半，聲音也喊啞了。
韶蹲在月台的盡頭，錄音機對著軌道，一動也不動。
程伯穿著燙得很平的制服，站在月台中間，手上拿著一面小旗子。
@sfx bell
平交道響了。
鐵路局在最後一班多掛了一節車廂，給鎮上的人坐到幹線，再坐公車回來。
阿嬤拉著我的手臂。
阿嬤：上車。
晏：我也要坐？
阿嬤：你不是回來坐一次的嗎？
@bg train dusk
@music night
車廂裡很擠。有人在哭，有人在拍照，有一個阿伯穿著舊的鐵路局制服，對著窗外敬禮。
列車慢慢開動。
月台往後退。小滿在冰攤後面揮手，不知道是對誰揮。韶站起來了，她的錄音機還對著車。倉庫二樓的窗戶開著，有一個人影靠在窗邊。
然後是平交道，叮、噹、叮、噹，被甩在後面。
然後是海。
阿嬤坐在我旁邊，看著窗外，很久沒有說話。
阿嬤：你阿公以前每天坐這班車去醫院。
阿嬤：我陪他坐了三年。看了三年的海。
阿嬤：後來他走了，我就不太坐了。
她說完，從包包裡拿出一包壓扁的鳳梨酥，拆開，分給我一半。
@wait 600
廣播：下一站——
車廂的喇叭響了一下，然後是很長的雜音。這段路的廣播，好像沒有被錄好。
窗外的海從橘色變成紫色，再變成深藍色。
我想起我來的那天，手機舉起來想拍，訊號從四格掉到一格，畫面卡在一片橘色上，不動了。
這次我沒有拿出手機。
我想起那個小女孩，那個錄空氣的人，那個閉著眼睛也會畫的人。
她們都在那個月台上，做著自己的事。而我只是經過。
可是我經過了。
明年夏天，沒有火車了。
但是阿嬤說，有公車。12:20 和 16:25，一天兩班。
我想，我大概會坐其中一班。
